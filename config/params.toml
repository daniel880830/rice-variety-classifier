# Experiment settings for `rice train` and `rice leakage-audit`.

[data]
target = "Class"
label_map = { Cammeo = 0, Osmancik = 1 }

[split]
test_size = 0.2
random_state = 42

[cv]
n_splits = 5
n_repeats = 3
random_state = 42

[bootstrap]
n_resamples = 2000
random_state = 42

# Each [models.<name>] table is a hyper-parameter grid searched on the training split.
[models.dummy]
strategy = ["most_frequent"]

[models.logistic_regression]
C = [0.01, 0.1, 1.0, 10.0, 100.0]

[models.knn]
n_neighbors = [5, 11, 21, 41]
weights = ["uniform", "distance"]

[models.svm_rbf]
C = [0.1, 1.0, 10.0]
gamma = ["scale", 0.01, 0.1]

[models.random_forest]
n_estimators = [300]
max_depth = [4, 8, 16]
min_samples_leaf = [1, 5, 20]

[models.hist_gradient_boosting]
learning_rate = [0.03, 0.1]
max_leaf_nodes = [7, 15, 31]
l2_regularization = [0.0, 1.0]
