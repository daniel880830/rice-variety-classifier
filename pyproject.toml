[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rice-variety-classifier"
version = "1.0.0"
description = "Rice variety (Cammeo vs Osmancik) classification: model selection with repeated CV, bootstrap confidence intervals, a FastAPI service and Docker."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "joblib>=1.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
rice = "rice_classifier.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "D", "PT", "RUF"]
# N803/N806: `X`, `X_train` follow the scikit-learn convention for feature matrices.
ignore = ["D105", "D107", "N803", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: trains on the real dataset (deselect with -m 'not slow')"]
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["rice_classifier"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
